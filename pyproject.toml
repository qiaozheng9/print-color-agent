[project]
name = "print-color-agent"
version = "0.1.0"
description = "印刷色彩预测与校准智能体 - Print Color Prediction and Calibration Agent"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.38",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-community>=0.3",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "python-dotenv>=1.0",
    "numpy>=1.24",
    "PyMuPDF>=1.24",
    "Pillow>=10.0",
    "colour-science>=0.4.4",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
